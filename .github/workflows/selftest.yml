name: Uctan uca deneme
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install -U faster-whisper pillow av
      - run: python selftest.py
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_IMAGE_MAX: "40"
      - uses: actions/upload-artifact@v4
        with:
          name: deneme
          path: |
            _out/video.mp4
            _out/kapak.jpg
            _out/short1.mp4
      - name: Sonucu Telegram'a gonder
        if: always()
        run: |
          CHAT=$(python - <<'PY'
          import json, os, urllib.request
          t = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          r = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{t}/getUpdates?timeout=0"))["result"]
          c = [u["message"]["chat"]["id"] for u in r if "message" in u]
          print(c[-1] if c else "")
          PY
          )
          T="${TELEGRAM_BOT_TOKEN}"
          if [ -z "$CHAT" ]; then echo "Telegram sohbeti yok (bota once mesaj yaz)"; exit 0; fi
          ls -la _out || true
          [ -f _out/short1.mp4 ] && curl -s -F chat_id=$CHAT -F video=@_out/short1.mp4 "https://api.telegram.org/bot$T/sendVideo" | head -c 100
          [ -f _out/kapak.jpg ] && curl -s -F chat_id=$CHAT -F photo=@_out/kapak.jpg "https://api.telegram.org/bot$T/sendPhoto" >/dev/null
          ffmpeg -y -loglevel error -i _out/video.mp4 -vf scale=960:-2 -c:v libx264 -crf 28 -preset veryfast -c:a aac -b:a 96k _out/onizleme.mp4
          [ -f _out/onizleme.mp4 ] && curl -s -F chat_id=$CHAT -F video=@_out/onizleme.mp4 -F supports_streaming=true "https://api.telegram.org/bot$T/sendVideo" | head -c 200
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Ornek kareleri kaydet
        if: always()
        run: |
          mkdir -p ornekler
          for t in 8 20 45 80 120; do ffmpeg -y -loglevel error -ss $t -i _out/video.mp4 -vframes 1 -vf scale=960:-2 ornekler/kare_$t.jpg || true; done
          cp _out/kapak.jpg ornekler/kapak_son.jpg || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add ornekler && git commit -m "ornek kareler" && git pull --rebase && git push || true
