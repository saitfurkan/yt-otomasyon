name: Deneme uretimi (yukleme yok)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .ses
          key: ses-yok
          restore-keys: ses-
      - run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -U faster-whisper pillow av
      - run: python debug_render.py
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          LAND_W: "1920"
      - name: Kareleri dala yaz
        if: always()
        run: |
          cd kareler_out && git init -q && git checkout -q -b kareler && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm kareler && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kareler
