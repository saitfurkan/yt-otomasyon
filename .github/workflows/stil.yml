name: Stil denemesi
on:
  workflow_dispatch:
    inputs:
      script:
        default: stil_denemesi.py
permissions:
  contents: write
jobs:
  stil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - run: sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
      - run: python ${{ inputs.script }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add ornekler && git commit -m "stil ornekleri" && git pull --rebase && git push
