name: Konu sec ve senaryo yaz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 3"

permissions:
  contents: write

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Konulari tara
        run: python topic_picker.py
      - name: Senaryo yaz
        run: python script_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Kaydet
        if: always()
        run: |
          git config user.name konu-bot
          git config user.email konu-bot@users.noreply.github.com
          git add -A
          git commit -m "Yeni konu ve senaryo" || echo "Degisiklik yok"
          git pull --rebase
          git push
