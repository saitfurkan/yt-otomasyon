name: Hikaye senaryosu yaz

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "Belirli hikaye (bos birakirsan siradakini secer)"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  hikaye:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hikaye yaz
        run: python story_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_ID: ${{ github.event.inputs.story_id }}
      - name: Kaydet
        if: always()
        run: |
          git config user.name konu-bot
          git config user.email konu-bot@users.noreply.github.com
          git add -A
          git commit -m "Yeni hikaye senaryosu" || echo "Degisiklik yok"
          git pull --rebase
          git push
